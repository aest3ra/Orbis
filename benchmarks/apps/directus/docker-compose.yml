services:
  directus:
    image: directus/directus:11.12.0
    container_name: orbis-bench-directus
    restart: unless-stopped
    environment:
      KEY: orbis-benchmark-key
      SECRET: orbis-benchmark-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: OrbisPassword1!
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      WEBSOCKETS_ENABLED: "true"
      PUBLIC_URL: http://localhost:38055
    volumes:
      - ./data/database:/directus/database
      - ./data/uploads:/directus/uploads

  proxy:
    image: nginx:1.27-alpine
    container_name: orbis-bench-directus-proxy
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "38055:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
