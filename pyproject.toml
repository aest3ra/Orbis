[project]
name = "orbis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "typer>=0.9",
    "rich>=13.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
orbis = "orbis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
